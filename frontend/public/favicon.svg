<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Deep Charcoal Dark Mode Canvas -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" />

  <!-- Road Geometry (Perspective Vector Highway) -->
  <polygon points="150,440 215,100 297,100 362,440" fill="#1e293b" />

  <!-- Road Center Dashed Line (Clean Minimalist Bars) -->
  <rect x="250" y="120" width="12" height="38" rx="6" fill="#64748b" />
  <rect x="249" y="190" width="14" height="54" rx="7" fill="#64748b" />
  <rect x="248" y="275" width="16" height="70" rx="8" fill="#64748b" />
  <rect x="246" y="375" width="20" height="65" rx="10" fill="#64748b" />

  <!-- Road Surface Pothole Damage Indicator (Geometric Crater) -->
  <ellipse cx="256" cy="310" rx="80" ry="42" fill="#020617" stroke="#f59e0b" stroke-width="6" />
  <ellipse cx="256" cy="310" rx="55" ry="26" fill="#090d16" />

  <!-- AI Detection Bounding Box / Corner HUD Brackets -->
  <!-- Top-Left -->
  <path d="M 140 240 L 140 200 L 180 200" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right -->
  <path d="M 332 200 L 372 200 L 372 240" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left -->
  <path d="M 140 370 L 140 410 L 180 410" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right -->
  <path d="M 332 410 L 372 410 L 372 370" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Laser AI Scan Crosshair (Cyan #06B6D4) -->
  <circle cx="256" cy="310" r="14" fill="none" stroke="#06b6d4" stroke-width="5" />
  <circle cx="256" cy="310" r="4" fill="#06b6d4" />
</svg>